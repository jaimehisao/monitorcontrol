name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK, PyGObject, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            python3-pip \
            python3-venv \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            xvfb

      - name: Virtualenv with system GI modules
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install coverage

      - name: Run tests under Xvfb
        env:
          PYTHONPATH: src
        run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -v

      - name: Coverage (fail under 80%)
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a .venv/bin/coverage run --source=src/monitorcontrol -m unittest discover -s tests
          .venv/bin/coverage report
