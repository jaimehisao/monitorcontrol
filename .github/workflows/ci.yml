name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Canonical source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build committed source archive
        run: ./scripts/build-source-archive.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: monitorcontrol-source
          path: dist/monitorcontrol-*-source.tar.gz
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK, PyGObject, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            python3-pip \
            python3-venv \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            xvfb

      - name: Virtualenv with system GI modules
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install coverage

      - name: Check release version consistency
        run: python3 scripts/release.py check

      - name: Run tests under Xvfb
        env:
          PYTHONPATH: src
        run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -v

      - name: Coverage (fail under 80%)
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a .venv/bin/coverage run --source=src/monitorcontrol -m unittest discover -s tests
          .venv/bin/coverage report

  build-rpm:
    name: Build Fedora ${{ matrix.version }} packages
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: ["43", "44"]
    container:
      image: fedora:${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monitorcontrol-source
          path: dist
      - name: Build RPM
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            rpm-build python3-devel \
            python3-setuptools python3-gobject cairo-gobject gobject-introspection gtk4 libadwaita \
            python3-wheel python3-build python3-pip pyproject-rpm-macros \
            systemd-rpm-macros
          archive="$(./scripts/select-package.sh dist 'monitorcontrol-*-source.tar.gz')"
          PACKAGE_OUTPUT_DIR="dist/packages/fedora-${{ matrix.version }}" \
            ./packaging/rpm/build.sh "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: monitorcontrol-fedora-${{ matrix.version }}
          path: dist/packages/fedora-${{ matrix.version }}/
          if-no-files-found: error

  validate-rpm:
    name: Clean install Fedora ${{ matrix.version }}
    needs: build-rpm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: ["43", "44"]
    container:
      image: fedora:${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monitorcontrol-fedora-${{ matrix.version }}
          path: package-output
      - name: Install, verify, and uninstall RPM
        run: |
          rpm_file="$(./scripts/select-package.sh package-output/rpm 'monitorcontrol-*.noarch.rpm')"
          version="$(rpm -qp --qf '%{VERSION}' "$rpm_file")"
          dnf -y install --setopt=install_weak_deps=False "$rpm_file"
          ./scripts/package-smoke-test.sh installed "$version"
          dnf -y remove monitorcontrol
          ./scripts/package-smoke-test.sh removed "$version"

  build-deb:
    name: Build ${{ matrix.target }} packages
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-24.04
            image: ubuntu:24.04
          - target: debian-13
            image: debian:13
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monitorcontrol-source
          path: dist
      - name: Install package build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential dpkg-dev
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y .
      - name: Build binary and source package
        run: |
          archive="$(./scripts/select-package.sh dist 'monitorcontrol-*-source.tar.gz')"
          PACKAGE_OUTPUT_DIR="dist/packages/${{ matrix.target }}" \
            ./packaging/debian/build.sh "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: monitorcontrol-${{ matrix.target }}
          path: dist/packages/${{ matrix.target }}/
          if-no-files-found: error

  validate-deb:
    name: Clean install ${{ matrix.target }}
    needs: build-deb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-24.04
            image: ubuntu:24.04
          - target: debian-13
            image: debian:13
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monitorcontrol-${{ matrix.target }}
          path: package-output
      - name: Install, verify, and uninstall DEB
        run: |
          apt-get update
          deb_file="$(./scripts/select-package.sh package-output/binary 'monitorcontrol_*_all.deb')"
          version="$(dpkg-deb -f "$deb_file" Version)"
          version="${version%%-*}"
          DEBIAN_FRONTEND=noninteractive apt-get install -y "./$deb_file"
          ./scripts/package-smoke-test.sh installed "$version"
          DEBIAN_FRONTEND=noninteractive apt-get purge -y monitorcontrol
          ./scripts/package-smoke-test.sh removed "$version"
