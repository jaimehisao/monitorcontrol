name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK, PyGObject, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            python3-pip \
            python3-venv \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            xvfb

      - name: Virtualenv with system GI modules
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install coverage build

      - name: Tests
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a .venv/bin/coverage run --source=src/monitorcontrol -m unittest discover -s tests
          .venv/bin/coverage report

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release.py check --tag "${GITHUB_REF_NAME}"

      - name: Build release artifacts
        run: |
          PYTHON=.venv/bin/python ./scripts/build-release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monitorcontrol-dist
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          cat > /tmp/release-notes.md <<EOF
          ## Downloads

          | File | What it is |
          | --- | --- |
          | \`monitorcontrol-${version}-py3-none-any.whl\` | Python wheel |
          | \`monitorcontrol-${version}.tar.gz\` | Python source distribution |
          | \`monitorcontrol-${version}-source.tar.gz\` | Full repository source archive |
          | \`SHA256SUMS\` | Checksums |

          RPM and Debian packages are the primary installation formats. The
          wheel and source distribution are secondary artifacts and still
          require distro-provided GTK 4, libadwaita, and PyGObject.

          \`\`\`bash
          pip install monitorcontrol-${version}-py3-none-any.whl
          \`\`\`
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            "dist/monitorcontrol-${version}-py3-none-any.whl" \
            "dist/monitorcontrol-${version}.tar.gz" \
            "dist/monitorcontrol-${version}-source.tar.gz" \
            dist/SHA256SUMS \
            --title "MonitorControl ${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes
